name: Android debug APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths: ['app/**', '.github/workflows/android-build.yml', 'scripts/**']
  workflow_dispatch:

concurrency:
  group: sellutions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform and build tools
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate JavaScript syntax and UI structure
        run: node scripts/check-ui.cjs
      - name: Assemble debug
        run: gradle --no-daemon :app:assembleDebug
      - name: Smoke test APK release assinado (chave descartável, não publicar)
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/smoke.jks" -storepass ci-test-pass -keypass ci-test-pass -alias sellutions-smoke -keyalg RSA -keysize 2048 -validity 2 -dname "CN=Sellutions CI"
          export SELLUTIONS_VERSION_CODE=1000
          export SELLUTIONS_VERSION_NAME=0.1.0
          export SELLUTIONS_KEYSTORE_PATH="$RUNNER_TEMP/smoke.jks"
          export SELLUTIONS_KEYSTORE_PASSWORD=ci-test-pass
          export SELLUTIONS_KEY_PASSWORD=ci-test-pass
          export SELLUTIONS_KEY_ALIAS=sellutions-smoke
          gradle --no-daemon :app:assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Sellutions-tiktok-pilot-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
