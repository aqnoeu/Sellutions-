name: TikTok backend tests
on:
  push:
    paths: ['backend/**', '.github/workflows/tiktok-backend-test.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/tiktok-backend-test.yml']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: node --test backend/test/tiktok.test.js
