name: Affiliate connector tests
on:
  push:
    branches: [main, feat/affiliate-oauth-connectors]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  connector-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check server/tiktok-creator-oauth.cjs
          node --check server/affiliate-ownership.cjs
      - name: Test affiliate ownership and attribution
        run: node --test server/*.test.cjs
      - name: Static Android UI check
        run: node scripts/check-ui.cjs
