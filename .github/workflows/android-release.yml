name: Sellutions — release Android assinada
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'assets/brand/**'
      - 'scripts/check-ui.cjs'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sellutions-signed-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Exigir certificado seguro
        env:
          KEYSTORE_B64: ${{ secrets.SELLUTIONS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SELLUTIONS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SELLUTIONS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SELLUTIONS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "::error::Falta secret SELLUTIONS_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::Falta secret SELLUTIONS_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Falta secret SELLUTIONS_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Falta secret SELLUTIONS_KEY_PASSWORD"; exit 1; }
      - uses: actions/checkout@v4
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar SDK 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Calcular versão contínua a partir das Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' | grep -E '^v0\.1\.[0-9]+$' | sed 's/^v0\.1\.//' | sort -n | tail -1 || true)
          if [[ -z "$previous" ]]; then patch=0; else patch=$((previous+1)); fi
          test "$patch" -lt 1000
          echo "SELLUTIONS_VERSION_CODE=$((1000+patch))" >> "$GITHUB_ENV"
          echo "SELLUTIONS_VERSION_NAME=0.1.$patch" >> "$GITHUB_ENV"
          echo "VERSION_TAG=v0.1.$patch" >> "$GITHUB_ENV"
      - name: Restaurar chave permanente sem divulgá-la
        env:
          KEYSTORE_B64: ${{ secrets.SELLUTIONS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SELLUTIONS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SELLUTIONS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SELLUTIONS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/sellutions-release.jks"
          echo "SELLUTIONS_KEYSTORE_PATH=$RUNNER_TEMP/sellutions-release.jks" >> "$GITHUB_ENV"
          echo "SELLUTIONS_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SELLUTIONS_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SELLUTIONS_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Verificar interface e compilar
        run: |
          node scripts/check-ui.cjs
          gradle --no-daemon :app:assembleRelease
      - name: Validar assinatura e produzir SHA-256
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          cp "$apk" sellutions-release.apk
          sha256sum sellutions-release.apk > sellutions-release.apk.sha256
          printf 'versionCode=%s\n\nVersão %s, assinatura verificada e hash SHA-256.\n' "$SELLUTIONS_VERSION_CODE" "$SELLUTIONS_VERSION_NAME" > release-notes.txt
      - name: Publicar APK na Release privada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION_TAG" sellutions-release.apk sellutions-release.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Sellutions $SELLUTIONS_VERSION_NAME" --notes-file release-notes.txt
