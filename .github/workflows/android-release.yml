name: Sellutions — release Android assinada
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'assets/brand/**'
      - 'scripts/check-ui.cjs'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sellutions-signed-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar SDK 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Recuperar ou criar assinatura persistente privada
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/sellutions-signing"
          cd "$RUNNER_TEMP/sellutions-signing"
          if gh release view signing-vault --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download signing-vault --repo "$GITHUB_REPOSITORY" --pattern 'android-signing.jks' --pattern 'android-signing.pass' --clobber
          else
            password=$(openssl rand -hex 24)
            keytool -genkeypair -noprompt \
              -keystore android-signing.jks -storetype PKCS12 \
              -storepass "$password" -keypass "$password" \
              -alias sellutions -keyalg RSA -keysize 3072 -validity 10000 \
              -dname "CN=Sellutions Android Pilot,O=Sellutions"
            printf '%s' "$password" > android-signing.pass
            gh release create signing-vault \
              android-signing.jks android-signing.pass \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "BACKUP PRIVADO: assinatura do piloto Android" \
              --notes "Release de rascunho com a chave de assinatura permanente. Nunca publicar nem excluir. Restringir acesso ao repositório." \
              --draft
          fi
          test -s android-signing.jks
          test -s android-signing.pass
          password=$(cat android-signing.pass)
          echo "::add-mask::$password"
          keytool -list -keystore android-signing.jks -storepass "$password" -alias sellutions >/dev/null
          echo "SELLUTIONS_KEYSTORE_PATH=$PWD/android-signing.jks" >> "$GITHUB_ENV"
          echo "SELLUTIONS_KEYSTORE_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "SELLUTIONS_KEY_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "SELLUTIONS_KEY_ALIAS=sellutions" >> "$GITHUB_ENV"
      - name: Calcular versão crescente
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          previous=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' | grep -E '^v0\.1\.[0-9]+$' | sed 's/^v0\.1\.//' | sort -n | tail -1 || true)
          if [[ -z "$previous" ]]; then patch=0; else patch=$((previous+1)); fi
          test "$patch" -lt 1000
          echo "SELLUTIONS_VERSION_CODE=$((1000+patch))" >> "$GITHUB_ENV"
          echo "SELLUTIONS_VERSION_NAME=0.1.$patch" >> "$GITHUB_ENV"
          echo "VERSION_TAG=v0.1.$patch" >> "$GITHUB_ENV"
      - name: Validar interface e compilar APK assinado
        run: |
          node scripts/check-ui.cjs
          gradle --no-daemon :app:assembleRelease
      - name: Validar assinatura e calcular SHA-256
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          cp "$apk" sellutions-release.apk
          sha256sum sellutions-release.apk > sellutions-release.apk.sha256
          printf 'versionCode=%s\n\nVersão %s, assinatura verificada e hash SHA-256.\n' "$SELLUTIONS_VERSION_CODE" "$SELLUTIONS_VERSION_NAME" > release-notes.txt
      - name: Publicar APK e hash na Release privada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION_TAG" sellutions-release.apk sellutions-release.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Sellutions $SELLUTIONS_VERSION_NAME" --notes-file release-notes.txt
