name: Shopee backend tests
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/shopee-backend-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test backend/test/shopee.test.js
