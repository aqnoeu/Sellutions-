name: Android emulator UI tests
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sellutions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  navigation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android emulator and instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: gradle --no-daemon :app:connectedDebugAndroidTest

      - name: Mostrar detalhes das falhas no console
        if: failure()
        run: |
          find app/build/outputs/androidTest-results -type f -name '*.xml' -exec cat {} \; || true
      - name: Arquivar resultados de testes e diagnósticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sellutions-android-test-results
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
          if-no-files-found: ignore
