plugins { id 'com.android.application' }

android {
    namespace 'com.aqnoeu.sellutions'
    compileSdk 35

    defaultConfig {
        applicationId 'com.aqnoeu.sellutions'
        minSdk 26
        targetSdk 35
        // Release builds override these values through CI environment.
        versionCode (System.getenv('SELLUTIONS_VERSION_CODE') ?: '1').toInteger()
        versionName System.getenv('SELLUTIONS_VERSION_NAME') ?: '0.1.0-dev'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    sourceSets {
        main {
            // Packaged unchanged. The two official SVG files are the brand source of truth.
            assets.srcDirs += ['../assets/brand']
        }
    }

    signingConfigs {
        pilotRelease {
            // Secrets belong to GitHub Actions; never commit a signing keystore.
            def path = System.getenv('SELLUTIONS_KEYSTORE_PATH')
            if (path) {
                storeFile file(path)
                storePassword System.getenv('SELLUTIONS_KEYSTORE_PASSWORD')
                keyAlias System.getenv('SELLUTIONS_KEY_ALIAS')
                keyPassword System.getenv('SELLUTIONS_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('SELLUTIONS_KEYSTORE_PATH')) {
                signingConfig signingConfigs.pilotRelease
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// The approved icon SVG contains the exact raster art embedded as a PNG.
// Extract those original bytes, without reinterpreting or redrawing the artwork.
tasks.register('generateBrandIcon') {
    inputs.file(file('../assets/brand/sellutions-icone.svg'))
    outputs.file(file('src/main/res/drawable-nodpi/sellutions_icon.png'))
    doLast {
        def svg = file('../assets/brand/sellutions-icone.svg').getText('UTF-8')
        def match = svg =~ /data:image\/png;base64,([A-Za-z0-9+\/=]+)/
        if (!match.find()) throw new GradleException('O SVG oficial não contém PNG incorporado.')
        def dest = file('src/main/res/drawable-nodpi/sellutions_icon.png')
        dest.parentFile.mkdirs()
        dest.bytes = java.util.Base64.getDecoder().decode(match.group(1))
    }
}
tasks.named('preBuild').configure { dependsOn('generateBrandIcon') }


dependencies {
    implementation 'androidx.core:core:1.13.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}
